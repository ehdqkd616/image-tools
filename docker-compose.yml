x-backend: &backend
  build:
    context: ./backend
    target: base
  image: image-studio-backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/imagestudio}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  volumes:
    - storage:/data/storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: image-studio-nginx
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # 크기 조절·용량 줄이기 (fast 큐)
  worker-fast:
    <<: *backend
    command: ["python", "-m", "app.workers.run", "fast"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 업스케일 (upscale 큐). GPU/Real-ESRGAN은 docker-compose.gpu.yml 참고
  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.run", "upscale"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 매일 1회 만료 파일 정리
  scheduler:
    <<: *backend
    command: ["sh", "-c", "exec rq cron app/workers/cron_config.py --url \"$$REDIS_URL\""]
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-imagestudio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
